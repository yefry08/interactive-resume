<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive resume of Yefry Núñez: explore it as a 2D side-scroller or a 3D sky-island world, with a clickable gallery of projects.">
<style>[hidden]{display:none!important}html,body{margin:0}</style><title>Yefry Núñez Interactive Resume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=Press+Start+2P&family=VT323&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap">

<style>
/* Concept: a game-like resume. Intro screen asks 2D (flat side-scroller) or 3D (low-poly sky islands); one shared set of stops, plus a project gallery layer reachable from both. Single committed look: bright sky world, ink-navy outlines, one warm sun accent. */
:root{
  --ink:#14213d;
  --ink-2:#2b3a5c;
  --muted:#5b6b8a;
  --paper:#ffffff;
  --sky:#2eb5f5;
  --sky-2:#8fdcfb;
  --sun:#ffb703;
  --coral:#ff5d73;
  --leaf:#4cd17a;
  --grape:#7a5af8;
  --night:#0b1030;
  --glass:rgba(11,16,48,.82);
  --glass-fg:#f2f6ff;
  --glass-line:rgba(255,255,255,.18);
  --c-company:#ffb703;
  --c-safety:#4d8dff;
  --c-agri:#4cd17a;
  --c-sust:#1fc8a8;
  --c-sim:#ff8a3d;
  --c-health:#ff5d73;
  --c-web:#9b7bff;
  --display:'Fredoka',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--glass-fg);font-family:var(--body)}
body{
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.theme-glass :focus-visible,.bar :focus-visible,#gallery :focus-visible,#intro :focus-visible,#dots :focus-visible{outline-color:#fff}

#scroller{width:1px;pointer-events:none}

/* ---------- top bar ---------- */
.bar{
  position:fixed;z-index:40;top:0;left:0;right:0;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(rgba(11,16,48,.72),rgba(11,16,48,0));
}
.brand{font:600 20px var(--display);background:none;border:0;cursor:pointer;color:#fff;padding:6px 4px;margin-right:auto;text-shadow:0 2px 0 rgba(20,33,61,.6)}
.seg{display:flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;color:var(--ink);font:600 14px var(--body);padding:8px 16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sun)}
.pill{border:2px solid var(--ink);background:#fff;color:var(--ink);font:600 14px var(--body);padding:8px 16px;border-radius:999px;cursor:pointer}
.pill:hover,.seg button:hover{background:var(--sky-2)}
.seg button[aria-pressed="true"]:hover{background:var(--sun)}
@media(max-width:520px){.brand{display:none}.bar{justify-content:space-between}}

/* ---------- intro: pixel art ---------- */
@keyframes blink{50%{opacity:0}}
#intro{
  position:fixed;inset:0;z-index:50;overflow:auto;background:#2a1a5e;color:#fff;
  font-family:'VT323',ui-monospace,Consolas,monospace;
}
#pxbg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;image-rendering:crisp-edges;image-rendering:pixelated}
#intro .in{
  position:relative;z-index:1;min-height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 20px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px));
}
#intro :focus-visible{outline:4px solid #ffd86b;outline-offset:4px}
#intro .ribbon{
  --pxc:#14102e;
  font:400 10px/1 'Press Start 2P',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;
  background:#ce1126;color:#fff;padding:10px 14px;
  box-shadow:0 -4px 0 0 var(--pxc),0 4px 0 0 var(--pxc),-4px 0 0 0 var(--pxc),4px 0 0 0 var(--pxc);
}
#intro h1{
  margin:6px 0 4px;color:#fff;text-transform:uppercase;text-wrap:balance;
  font:400 clamp(1.25rem,5.6vw,3.3rem)/1.25 'Press Start 2P',ui-monospace,monospace;
  text-shadow:-3px -3px 0 #14102e,3px -3px 0 #14102e,-3px 3px 0 #14102e,3px 3px 0 #14102e,0 3px 0 #14102e,0 7px 0 #ff5d73,3px 7px 0 #14102e,-3px 7px 0 #14102e,0 10px 0 #14102e;
}
#intro .sub{
  --pxc:#8fdcfb;
  margin:0;max-width:34ch;padding:10px 16px;background:rgba(26,16,64,.88);
  font:400 26px/1.15 'VT323',ui-monospace,monospace;color:#fff;
  box-shadow:0 -4px 0 0 var(--pxc),0 4px 0 0 var(--pxc),-4px 0 0 0 var(--pxc),4px 0 0 0 var(--pxc);
}
#intro .press{margin:4px 0 0;font:400 12px/1 'Press Start 2P',ui-monospace,monospace;color:#ffd86b;letter-spacing:.06em;text-shadow:2px 2px 0 #14102e;animation:blink 1.1s steps(2) infinite}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,310px));gap:28px;justify-content:center;width:100%;margin-top:6px}
@media(max-width:700px){.choices{grid-template-columns:minmax(0,340px);gap:24px}}
.choice{
  --pxc:#ffd86b;
  background:#1a1040;color:#fff;border:0;cursor:pointer;text-align:left;padding:14px 14px 16px;
  display:flex;flex-direction:column;gap:10px;
  box-shadow:0 -4px 0 0 var(--pxc),0 4px 0 0 var(--pxc),-4px 0 0 0 var(--pxc),4px 0 0 0 var(--pxc),inset 4px 4px 0 0 rgba(255,255,255,.1);
  filter:drop-shadow(6px 6px 0 rgba(10,6,30,.55));
}
.choice:hover,.choice:focus-visible{--pxc:#fff;transform:translateY(-4px)}
.choice .pv{width:100%;height:auto;display:block;aspect-ratio:16/9;image-rendering:crisp-edges;image-rendering:pixelated;box-shadow:0 0 0 4px #14102e}
.choice b{display:flex;align-items:center;font:400 22px/1 'Press Start 2P',ui-monospace,monospace;color:#ffd86b;text-shadow:3px 3px 0 #14102e;margin-top:4px}
.choice b::before{content:"";display:inline-block;width:12px;height:14px;margin-right:12px;background:#ffd86b;clip-path:polygon(0 0,100% 50%,0 100%);visibility:hidden}
.choice:hover b::before,.choice:focus-visible b::before{visibility:visible;animation:blink .8s steps(2) infinite}
.choice span{font:400 23px/1.1 'VT323',ui-monospace,monospace;color:#e9e4ff}
.linkbtn{
  --pxc:#8fdcfb;
  background:#14102e;border:0;color:#fff;cursor:pointer;padding:11px 14px;margin-top:8px;
  font:400 10px/1.4 'Press Start 2P',ui-monospace,monospace;letter-spacing:.04em;
  box-shadow:0 -4px 0 0 var(--pxc),0 4px 0 0 var(--pxc),-4px 0 0 0 var(--pxc),4px 0 0 0 var(--pxc);
}
.linkbtn:hover{color:#ffd86b;--pxc:#ffd86b}

/* ---------- worlds ---------- */
.world{position:fixed;inset:0;z-index:1;overflow:hidden}
#w2d{background:linear-gradient(#2eb5f5,#9be3fb 72%,#d8f3ff);--charx:300px;--groundh:150px}
.layer{position:absolute;left:0;right:0;background-repeat:repeat-x;pointer-events:none}
#l-clouds{top:6%;height:48%;background-size:auto 100%}
#l-hills{bottom:var(--groundh);height:40%;background-size:auto 100%;background-position-y:bottom}
#l-trees{bottom:var(--groundh);height:30%;background-size:auto 100%;background-position-y:bottom}
#grass{position:absolute;left:0;right:0;bottom:calc(var(--groundh) - 14px);height:16px;background:#7ed957;border-top:4px solid var(--ink);z-index:3}
#dirt{position:absolute;left:0;right:0;bottom:0;height:calc(var(--groundh) - 14px);z-index:3;border-top:4px solid var(--ink);
  background:repeating-linear-gradient(135deg,#8b5a3c 0 14px,#9a6a47 14px 28px)}
#l-world{position:absolute;left:0;top:0;bottom:0;width:0;z-index:4;will-change:transform}
.stop2d{position:absolute;top:0;bottom:0;width:0}
.stop2d .panel{position:absolute;left:112px;top:calc(env(safe-area-inset-top,0px) + 74px);
  width:min(500px,calc(100vw - var(--charx) - 140px));max-height:calc(100% - var(--groundh) - 96px - env(safe-area-inset-top,0px));overflow:auto}
.stop2d .prop{position:absolute;bottom:calc(var(--groundh) - 6px);left:-230px;width:170px;display:block;overflow:visible}
button.prop{background:none;border:0;padding:0;cursor:pointer}
button.prop:hover{filter:brightness(1.08)}
.svgt{font-family:var(--display);font-weight:600}
#hero2d{position:absolute;z-index:6;left:calc(var(--charx) - 45px);bottom:calc(var(--groundh) - 8px);width:90px;height:170px;pointer-events:none}
#hero2d svg{width:100%;height:100%;overflow:visible}
#hero2d .body{animation:bob 1.1s ease-in-out infinite;animation-play-state:paused}
#hero2d .legL,#hero2d .legR,#hero2d .armL,#hero2d .armR{animation:swing .55s ease-in-out infinite alternate;animation-play-state:paused}
#hero2d .legL{transform-origin:36px 108px}
#hero2d .legR{transform-origin:54px 108px;animation-direction:alternate-reverse}
#hero2d .armL{transform-origin:24px 62px;animation-direction:alternate-reverse}
#hero2d .armR{transform-origin:66px 62px}
#hero2d.walking .body,#hero2d.walking .legL,#hero2d.walking .legR,#hero2d.walking .armL,#hero2d.walking .armR{animation-play-state:running}
@keyframes swing{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media(max-width:700px){
  #w2d{--charx:22vw}
  .stop2d .panel{left:calc(14px - var(--charx));width:calc(100vw - 28px);max-height:calc(52% - env(safe-area-inset-top,0px));top:calc(env(safe-area-inset-top,0px) + 64px)}
  .stop2d .prop{display:none}
}

#w3d{background:#37b6f2}
#c3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
#panels3d{position:absolute;inset:0;pointer-events:none}
button.prop svg{width:100%;height:auto;display:block}
.p3{pointer-events:none;position:absolute;top:50%;width:min(460px,44vw);max-height:calc(100% - 150px);overflow:auto;transform:translateY(-50%)}
.p3.left{left:max(16px,5vw)}
.p3.right{right:max(16px,5vw)}
@media(max-width:760px){
  .p3{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 52px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;max-height:46%;transform:none}
  .p3.left,.p3.right{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px))}
}

/* ---------- panel cards ---------- */
.panel{opacity:0;pointer-events:none;will-change:opacity,transform}
.panel.on{pointer-events:auto}
.card{padding:20px 22px 22px;font-size:15.5px;line-height:1.55}
.theme-paper .card{background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:14px;box-shadow:8px 8px 0 var(--ink)}
.theme-glass .card{background:var(--glass);color:var(--glass-fg);border:1px solid var(--glass-line);border-radius:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card .eyebrow{display:inline-block;font:700 12px var(--body);letter-spacing:.12em;text-transform:uppercase;background:var(--ac,var(--sun));color:var(--ink);padding:4px 10px;border-radius:999px;margin:0 0 10px}
.card h1,.card h2{font-family:var(--display);font-weight:600;margin:0 0 8px;line-height:1.05;text-wrap:balance}
.card h1{font-size:clamp(2.2rem,5vw,3.2rem);font-weight:700}
.card h2{font-size:clamp(1.55rem,3.4vw,2.1rem)}
.card p{margin:0 0 10px;max-width:60ch}
.card .role{font:600 17px var(--body);margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 0;padding:0;list-style:none}
.chip{display:inline-block;padding:4px 11px;border-radius:999px;border:2px solid currentColor;font-weight:600;font-size:13px}
.hint{margin-top:12px;font-weight:600;font-size:14px;opacity:.75}
.rows{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:10px}
.rows li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 14px;align-items:baseline}
.rows b{font-weight:700}
.rows .m{opacity:.7;font-size:14px;text-align:right}
.rows .full{grid-column:1/-1;opacity:.75;font-size:14px}
.sub-h{font:700 12px var(--body);letter-spacing:.12em;text-transform:uppercase;opacity:.65;margin:14px 0 4px}
.btn{font:700 15px var(--body);padding:10px 18px;border-radius:999px;border:2px solid var(--ink);background:var(--sun);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.07)}
.btn.alt{background:#fff}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.mail{display:block;font:600 18px/1.3 var(--body);background:rgba(127,127,127,.14);border-radius:8px;padding:8px 12px;margin:6px 0 4px;word-break:break-all;user-select:all}

/* ---------- progress dots ---------- */
#dots{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:6px;padding:7px 10px;border-radius:999px;background:rgba(11,16,48,.72)}
#dots button{width:14px;height:14px;border-radius:50%;border:2px solid #fff;background:transparent;padding:0;cursor:pointer}
#dots button[aria-current="step"]{background:var(--sun);border-color:var(--sun);transform:scale(1.25)}
.scrollhint{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 54px);font:600 13px var(--body);color:#fff;background:rgba(11,16,48,.72);padding:6px 12px;border-radius:999px;pointer-events:none;transition:opacity .4s}

/* ---------- gallery: matrix / space tech ---------- */
#gallery{position:fixed;inset:0;z-index:60;background:#000805;overflow:auto;color:#aaffd6;font-family:'Share Tech Mono',ui-monospace,Consolas,monospace;--g:#00ff9c;--g2:#00e5ff}
#gallery :focus-visible{outline:2px solid var(--g2);outline-offset:3px}
#rain{position:fixed;inset:0;width:100%;height:100%;opacity:.6;pointer-events:none;z-index:0}
#gallery::before{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 28%,transparent 38%,rgba(0,6,3,.82) 100%),repeating-linear-gradient(rgba(0,255,156,.05) 0 1px,transparent 1px 3px)}
.g-in{position:relative;z-index:2;max-width:1240px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 36px) max(16px,env(safe-area-inset-left,0px))}
.g-hud{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:12px;letter-spacing:.16em;color:#00c97d;border-bottom:1px solid rgba(0,255,156,.3);padding-bottom:8px;margin-bottom:16px;text-transform:uppercase}
.g-hud b{color:var(--g);font-weight:400}
.g-hud .on{color:var(--g);animation:blink 1.4s steps(2) infinite}
.g-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.g-head .holo{width:96px;flex:none;--ac:var(--g)}
.g-head .holo::after{content:"";position:absolute;inset:6%;border-radius:50%;background:conic-gradient(from 0deg,rgba(0,255,156,.5),transparent 30%);animation:spin 3.4s linear infinite;pointer-events:none}
.inf{font:900 36px/1 'Orbitron',sans-serif;color:var(--g);text-shadow:0 0 14px var(--g);animation:flipy 6s linear infinite;position:relative;z-index:1}
.g-tt{flex:1;min-width:220px}
.g-tt h2{position:relative;margin:0 0 6px;font:900 clamp(1.7rem,5.2vw,3rem)/1 'Orbitron',sans-serif;letter-spacing:.06em;color:#eafff5;text-shadow:0 0 12px var(--g),0 0 34px rgba(0,255,156,.5)}
.g-tt h2::before,.g-tt h2::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;opacity:0;pointer-events:none}
.g-tt h2::before{color:var(--g2);clip-path:inset(0 0 58% 0);animation:glitch 3.4s steps(1) infinite}
.g-tt h2::after{color:#ff2bd6;clip-path:inset(58% 0 0 0);animation:glitch 3.4s steps(1) infinite reverse}
@keyframes glitch{0%,86%,100%{opacity:0;transform:none}88%{opacity:.85;transform:translate(-3px,0)}93%{opacity:.85;transform:translate(3px,1px)}97%{opacity:0}}
.g-tt p{margin:0;font-size:14px;letter-spacing:.08em;color:#6fd9a8}
.g-close{border:1px solid var(--g);background:rgba(0,255,156,.08);color:var(--g);font:inherit;font-size:13px;letter-spacing:.14em;padding:10px 16px;cursor:pointer;text-transform:uppercase}
.g-close:hover{background:var(--g);color:#00140b;box-shadow:0 0 18px rgba(0,255,156,.6)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.filters button{border:1px solid rgba(0,255,156,.45);background:rgba(0,20,12,.72);color:var(--g);font:inherit;font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:7px 12px;cursor:pointer}
.filters button:hover{border-color:var(--g);box-shadow:0 0 12px rgba(0,255,156,.35)}
.filters button[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:#00140b;box-shadow:0 0 16px rgba(0,255,156,.55)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}

/* rotating holo icon (shared by header and tiles) */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flipy{to{transform:rotateY(360deg)}}
@keyframes sweep{from{background-position:0 200%}to{background-position:0 -100%}}
.holo{position:relative;display:grid;place-items:center;aspect-ratio:1/1;perspective:520px}
.holo *{animation-delay:calc(var(--d,0) * -1s)}
.holo .ring{position:absolute;border-radius:50%;pointer-events:none}
.holo .r1{inset:1%;border:1.5px dashed var(--ac);opacity:.8;animation:spin 22s linear infinite}
.holo .r2{inset:15%;border:1px dotted #aaffd6;opacity:.75;animation:spin 14s linear infinite reverse}
.holo .r3{inset:29%;border:2px solid transparent;border-top-color:var(--ac);border-bottom-color:var(--ac);animation:spin 5s linear infinite}
.holo .orbit{position:absolute;inset:1%;border-radius:50%;animation:spin 9s linear infinite;pointer-events:none}
.holo .orbit b{position:absolute;top:-3px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--ac);box-shadow:0 0 8px var(--ac),0 0 18px var(--ac)}
.holo .o2{inset:15%;animation-duration:6s;animation-direction:reverse}
.holo .o2 b{background:#fff;box-shadow:0 0 8px #fff,0 0 16px var(--g2)}
.holo .glyph{width:40%;height:auto;fill:none;stroke:var(--ac);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px var(--ac));animation:flipy 7s linear infinite}

.tile{position:relative;display:flex;flex-direction:column;min-width:0;text-decoration:none;color:#c8ffe4;background:rgba(0,16,10,.84);
  border:1px solid color-mix(in srgb,var(--ac) 45%,transparent);transition:transform .18s,box-shadow .18s,border-color .18s}
.tile::before{content:"";position:absolute;inset:-1px;pointer-events:none;z-index:3;
  background:
   linear-gradient(var(--ac),var(--ac)) 0 0/16px 2px no-repeat,linear-gradient(var(--ac),var(--ac)) 0 0/2px 16px no-repeat,
   linear-gradient(var(--ac),var(--ac)) 100% 0/16px 2px no-repeat,linear-gradient(var(--ac),var(--ac)) 100% 0/2px 16px no-repeat,
   linear-gradient(var(--ac),var(--ac)) 0 100%/16px 2px no-repeat,linear-gradient(var(--ac),var(--ac)) 0 100%/2px 16px no-repeat,
   linear-gradient(var(--ac),var(--ac)) 100% 100%/16px 2px no-repeat,linear-gradient(var(--ac),var(--ac)) 100% 100%/2px 16px no-repeat}
.tile:hover,.tile:focus-visible{transform:translateY(-5px);border-color:var(--ac);box-shadow:0 0 0 1px var(--ac),0 0 30px color-mix(in srgb,var(--ac) 45%,transparent),inset 0 0 34px color-mix(in srgb,var(--ac) 12%,transparent)}
.stage{position:relative;aspect-ratio:16/10;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--ac) 22%,transparent),transparent 62%),
   linear-gradient(rgba(0,255,156,.08) 1px,transparent 1px) 0 0/18px 18px,linear-gradient(90deg,rgba(0,255,156,.08) 1px,transparent 1px) 0 0/18px 18px}
.stage .holo{height:88%}

/* matrix rain behind the gallery */
var RAIN={raf:0,last:0,fs:16,drops:[],glyphs:[],c:null,w:0,h:0};
(function(){for(var k=0xFF66;k<=0xFF9D;k++)RAIN.glyphs.push(String.fromCharCode(k));'0123456789'.split('').forEach(function(d){RAIN.glyphs.push(d)})})();
function rainFrame(){
  var c=RAIN.c,fs=RAIN.fs,w=RAIN.w,h=RAIN.h;
  c.fillStyle='rgba(0,8,5,.1)';c.fillRect(0,0,w,h);
  c.font=fs+'px "Share Tech Mono",monospace';
  for(var i=0;i<RAIN.drops.length;i++){

    c.fillStyle=Math.random()<.05?'#e6fff3':'#00ff9c';
    c.fillText(ch,i*fs,y);
    if(y>h&&Math.random()>.975)RAIN.drops[i]=0;
    RAIN.drops[i]++;
  }
}
function rainLoop(ts){
  RAIN.raf=requestAnimationFrame(rainLoop);
  if(ts-RAIN.last<45)return;RAIN.last=ts;rainFrame();
}
function rainStart(){
  cancelAnimationFrame(RAIN.raf);
  var cv=$('#rain');
  RAIN.w=cv.width=innerWidth;RAIN.h=cv.height=innerHeight;RAIN.c=cv.getContext('2d');
  RAIN.c.fillStyle='#000805';RAIN.c.fillRect(0,0,RAIN.w,RAIN.h);
  RAIN.drops=[];
  for(var i=0,n=Math.ceil(RAIN.w/RAIN.fs);i<n;i++)RAIN.drops.push(Math.floor(Math.random()*RAIN.h/RAIN.fs));
  if(reduce){for(var k=0;k<70;k++)rainFrame()}else RAIN.raf=requestAnimationFrame(rainLoop);

function cloud(x,y,s){return '<g transform="translate('+x+' '+y+') scale('+s+')" fill="#fff"><circle cx="40" cy="40" r="26"/><circle cx="76" cy="30" r="32"/><circle cx="116" cy="42" r="24"/><rect x="14" y="40" width="124" height="26" rx="13"/></g>'}
function tree(x,h,c){return '<rect x="'+(x-9)+'" y="'+(260-h*.45)+'" width="18" height="'+(h*.45)+'" fill="#8b5a3c" stroke="#14213d" stroke-width="4"/><circle cx="'+x+'" cy="'+(260-h*.6)+'" r="'+(h*.34)+'" fill="'+c+'" stroke="#14213d" stroke-width="4"/>'}
function build2D(){
  $('#l-clouds').style.backgroundImage=svgURL('<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="320" viewBox="0 0 1400 320">'+cloud(80,40,1)+cloud(520,170,.7)+cloud(860,30,1.2)+cloud(1200,180,.8)+'</svg>');
  $('#l-hills').style.backgroundImage=svgURL('<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300"><path d="M0 300 V170 C120 60 280 60 400 170 C520 100 700 90 1000 170 V300Z" fill="#6fd16f" stroke="#14213d" stroke-width="4"/><path d="M0 300 V230 C200 140 360 150 520 230 C700 160 860 170 1000 230 V300Z" fill="#4fb85f" stroke="#14213d" stroke-width="4"/></svg>');
  $('#l-trees').style.backgroundImage=svgURL('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260">'+tree(90,190,'#38b36b')+tree(250,130,'#4fc77a')+tree(470,210,'#2fa05e')+tree(650,150,'#38b36b')+'</svg>');
  var w=$('#l-world');var h='';
  var props={
    hero:'<g stroke="#14213d" stroke-width="4" stroke-linejoin="round"><path d="M40 146 V16" fill="none"/><path d="M42 18 H128 L112 40 L128 62 H42Z" fill="#ff5d73"/><circle cx="40" cy="14" r="8" fill="#ffb703"/></g><text class="svgt" x="52" y="47" font-size="22" fill="#fff">START</text>',
    about:'<g stroke="#14213d" stroke-width="4" stroke-linejoin="round"><path d="M20 146 V72 H150 V146Z" fill="#fff4d6"/><path d="M8 76 L85 14 L162 76Z" fill="#ff5d73"/><rect x="68" y="98" width="34" height="48" fill="#4d8dff"/><rect x="28" y="86" width="28" height="26" fill="#9fe3ff"/><rect x="114" y="86" width="28" height="26" fill="#9fe3ff"/></g>',
    skills:'<g stroke="#14213d" stroke-width="4"><rect x="6" y="56" width="46" height="46" fill="#ffb703"/><rect x="62" y="56" width="46" height="46" fill="#ffb703"/><rect x="118" y="56" width="46" height="46" fill="#ffb703"/></g><g class="svgt" font-size="30" fill="#14213d" text-anchor="middle"><text x="29" y="89">?</text><text x="85" y="89">?</text><text x="141" y="89">?</text></g>',
    xp:'<g stroke="#14213d" stroke-width="4" stroke-linejoin="round"><path d="M62 54 V38 Q62 28 72 28 H98 Q108 28 108 38 V54" fill="none"/><rect x="20" y="52" width="130" height="94" rx="12" fill="#c98a4a"/><path d="M20 90 H150" fill="none"/><rect x="73" y="82" width="24" height="18" rx="4" fill="#ffb703"/></g>',
    edu:'<g stroke="#14213d" stroke-width="4" stroke-linejoin="round"><rect x="14" y="64" width="142" height="82" fill="#e6f0ff"/><path d="M6 68 L85 22 L164 68Z" fill="#4d8dff"/><rect x="30" y="80" width="14" height="66" fill="#fff"/><rect x="58" y="80" width="14" height="66" fill="#fff"/><rect x="98" y="80" width="14" height="66" fill="#fff"/><rect x="126" y="80" width="14" height="66" fill="#fff"/><path d="M85 22 V2" fill="none"/><path d="M85 3 H110 L102 10 L110 17 H85Z" fill="#ff5d73"/></g>',
    awards:'<g stroke="#14213d" stroke-width="4" stroke-linejoin="round"><rect x="58" y="72" width="54" height="74" fill="#ffb703"/><rect x="6" y="102" width="52" height="44" fill="#c9d4e6"/><rect x="112" y="114" width="52" height="32" fill="#e0a070"/><path d="M85 8 L92 26 L111 27 L96 39 L101 57 L85 47 L69 57 L74 39 L59 27 L78 26Z" fill="#ffd166"/></g><g class="svgt" font-size="26" fill="#14213d" text-anchor="middle"><text x="85" y="108">1</text><text x="32" y="132">2</text><text x="138" y="137">3</text></g>',
    projects:'<g stroke="#14213d" stroke-width="4" stroke-linejoin="round"><path d="M24 146 V68 A61 61 0 0 1 146 68 V146Z" fill="#7a5af8"/><path d="M44 146 V70 A41 41 0 0 1 126 70 V146Z" fill="#14213d"/></g><g fill="#ffd166"><circle cx="70" cy="86" r="3"/><circle cx="102" cy="104" r="2.5"/><circle cx="84" cy="124" r="3"/><circle cx="108" cy="80" r="2"/></g><g class="svgt" font-size="15" fill="#ffd166" text-anchor="middle"><text x="85" y="74">OPEN</text><text x="85" y="92">GALLERY</text></g>',
    contact:'<g stroke="#14213d" stroke-width="4" stroke-linejoin="round"><rect x="78" y="94" width="14" height="52" fill="#8b5a3c"/><path d="M36 98 V66 A49 30 0 0 1 134 66 V98Z" fill="#ff5d73"/><rect x="112" y="30" width="6" height="40" fill="#14213d"/><rect x="118" y="30" width="22" height="14" fill="#ffb703"/><rect x="56" y="74" width="40" height="8" rx="4" fill="#14213d"/></g>'
  };
  STOPS.forEach(function(s,i){
    var propEl=s.id==='projects'
      ? '<button class="prop" type="button" data-open-gallery aria-label="Open the projects gallery"><svg viewBox="0 0 170 150">'+props[s.id]+'</svg></button>'
      : '<svg class="prop" viewBox="0 0 170 150" aria-hidden="true">'+props[s.id]+'</svg>';
    h+='<div class="stop2d" data-i="'+i+'">'+propEl+panelHTML(s,i,'a')+'</div>';
  });
  w.innerHTML=h;
  stops2d=[].slice.call(w.querySelectorAll('.stop2d'));
  panels2d=stops2d.map(function(el){return el.querySelector('.panel')});
}

/* ============ 3D WORLD ============ */
var Y_STEP=14;
function build3D(){
  if(!window.THREE)return null;
  var canvas=$('#c3d'),renderer;
  try{renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true})}catch(e){return null}
  if(!renderer||!renderer.getContext())return null;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
  var scene=new THREE.Scene();
  scene.fog=new THREE.Fog(0x37b6f2,26,80);
  var cam=new THREE.PerspectiveCamera(42,1,.1,220);
  scene.add(new THREE.HemisphereLight(0xffffff,0x8a9bb8,.95));
  var sun=new THREE.DirectionalLight(0xfff2d6,.95);sun.position.set(6,12,9);scene.add(sun);

  function M(c,o){var m=new THREE.MeshStandardMaterial({color:c,flatShading:true,roughness:.95,metalness:0});if(o)for(var k in o)m[k]=o[k];return m}
  function mesh(g,m,x,y,z){var o=new THREE.Mesh(g,m);o.position.set(x||0,y||0,z||0);return o}
  var rnd=(function(s){return function(){s=(s*16807)%2147483647;return (s-1)/2147483646}})(7);

  function island(r){
    var g=new THREE.Group();
    g.add(mesh(new THREE.CylinderGeometry(r,r*.94,.7,8),M(0x6fdc6b)));
    g.add(mesh(new THREE.CylinderGeometry(r*.94,r*.9,.35,8),M(0x9a6a43),0,-.52,0));
    var cone=mesh(new THREE.ConeGeometry(r*.9,r*1.9,8),M(0x8b5a3c),0,-.7-r*.95,0);cone.rotation.x=Math.PI;g.add(cone);
    for(var i=0;i<5;i++){
      var a=i/5*Math.PI*2+.4,rr=r*(.62+rnd()*.25);
      g.add(mesh(new THREE.IcosahedronGeometry(.16+rnd()*.2,0),M(0xbab7cf),Math.cos(a)*rr,.4,Math.sin(a)*rr));
    }
    return g;
  }
  function pine(x,z,s){
    var t=new THREE.Group();
    t.add(mesh(new THREE.CylinderGeometry(.08*s,.1*s,.5*s,5),M(0x7a4a2b),0,.25*s,0));
    t.add(mesh(new THREE.ConeGeometry(.5*s,.9*s,6),M(0x2fa05e),0,.85*s,0));
    t.add(mesh(new THREE.ConeGeometry(.38*s,.7*s,6),M(0x38b36b),0,1.3*s,0));
    t.position.set(x,.35,z);return t;
  }

  /* character */
  var hero=new THREE.Group(),armL,armR,head;
  (function(){
    var skin=M(0xc68a5e),shirt=M(0xff9f1c),jeans=M(0x2f6fed),shoe=M(0xffffff),hair=M(0x1b1b1b);
    hero.add(mesh(new THREE.BoxGeometry(.3,.9,.34),jeans,-.2,.45,0));
    hero.add(mesh(new THREE.BoxGeometry(.3,.9,.34),jeans,.2,.45,0));
    hero.add(mesh(new THREE.BoxGeometry(.34,.16,.5),shoe,-.2,.08,.08));
    hero.add(mesh(new THREE.BoxGeometry(.34,.16,.5),shoe,.2,.08,.08));
    hero.add(mesh(new THREE.BoxGeometry(.95,1.1,.55),shirt,0,1.45,0));
    armL=new THREE.Group();armL.position.set(-.62,1.9,0);armL.add(mesh(new THREE.BoxGeometry(.26,.95,.3),shirt,0,-.42,0));armL.add(mesh(new THREE.IcosahedronGeometry(.17,0),skin,0,-.95,0));hero.add(armL);
    armR=new THREE.Group();armR.position.set(.62,1.9,0);armR.add(mesh(new THREE.BoxGeometry(.26,.95,.3),shirt,0,-.42,0));armR.add(mesh(new THREE.IcosahedronGeometry(.17,0),skin,0,-.95,0));hero.add(armR);
    head=new THREE.Group();head.position.set(0,2.4,0);
    head.add(mesh(new THREE.IcosahedronGeometry(.45,1),skin));
    var hr=mesh(new THREE.IcosahedronGeometry(.48,1),hair,0,.12,-.05);hr.scale.set(1,.7,1);head.add(hr);
    head.add(mesh(new THREE.BoxGeometry(.08,.1,.05),M(0x14213d),-.16,0,.43));
    head.add(mesh(new THREE.BoxGeometry(.08,.1,.05),M(0x14213d),.16,0,.43));
    hero.add(head);
  })();
  hero.scale.setScalar(1.05);hero.position.set(0,.35,0);

  var props=[];
  var islands=[];
  var narrow=false;
  var skillOrbit=null,globe=null,starsG=null,portal=null,portalRing=null,portalCards=null,pinsG=null;

  STOPS.forEach(function(s,i){
    var isl=island(2.6);var g=new THREE.Group();g.add(isl);
    var p=new THREE.Group();p.position.y=.35;
    if(s.id==='hero'){p.add(hero);hero.position.y=0;p.add(pine(-1.7,-.6,1));p.add(pine(1.8,-1,.8));}
    if(s.id==='about'){
      p.add(mesh(new THREE.BoxGeometry(1.7,1.2,1.5),M(0xfff4d6),0,.6,0));
      var roof=mesh(new THREE.ConeGeometry(1.45,.95,4),M(0xff5d73),0,1.65,0);roof.rotation.y=Math.PI/4;p.add(roof);
      p.add(mesh(new THREE.BoxGeometry(.4,.7,.06),M(0x4d8dff),0,.35,.78));
      p.add(mesh(new THREE.BoxGeometry(.36,.36,.06),M(0x9fe3ff),-.55,.8,.78));p.add(mesh(new THREE.BoxGeometry(.36,.36,.06),M(0x9fe3ff),.55,.8,.78));
      p.add(pine(-1.8,.5,1.1));p.add(pine(1.7,.9,.9));
    }
    if(s.id==='skills'){
      skillOrbit=new THREE.Group();skillOrbit.position.y=1.3;
      var cols=[0xffb703,0x4d8dff,0xff5d73,0x4cd17a,0x9b7bff,0x1fc8a8];
      cols.forEach(function(c,k){var a=k/6*Math.PI*2;var cb=mesh(new THREE.BoxGeometry(.75,.75,.75),M(c),Math.cos(a)*1.6,Math.sin(k*1.7)*.4,Math.sin(a)*1.6);skillOrbit.add(cb)});
      p.add(skillOrbit);p.add(pine(0,0,1.2));
    }
    if(s.id==='xp'){
      globe=new THREE.Group();globe.position.y=1.9;
      globe.add(mesh(new THREE.IcosahedronGeometry(1.35,1),M(0x2a9d8f)));
      globe.add(mesh(new THREE.IcosahedronGeometry(1.4,1),new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:.3})));
      p.add(globe);p.add(mesh(new THREE.CylinderGeometry(.5,.7,.3,6),M(0x8b5a3c),0,.15,0));
    }
    if(s.id==='edu'){
      p.add(mesh(new THREE.BoxGeometry(2.6,.2,1.9),M(0xd8dde8),0,.1,0));
      p.add(mesh(new THREE.BoxGeometry(2.3,1.1,1.5),M(0xe6f0ff),0,.75,0));
      for(var k=0;k<4;k++)p.add(mesh(new THREE.CylinderGeometry(.11,.11,1.1,6),M(0xffffff),-.85+k*.57,.75,.85));
      var r2=mesh(new THREE.ConeGeometry(1.55,.8,3),M(0x4d8dff),0,1.7,0);r2.rotation.y=Math.PI/2;r2.scale.set(1,1,.62);p.add(r2);
      p.add(mesh(new THREE.CylinderGeometry(.03,.03,.9,4),M(0x14213d),0,2.5,0));
      p.add(mesh(new THREE.BoxGeometry(.5,.28,.03),M(0xff5d73),.26,2.76,0));
    }
    if(s.id==='awards'){
      var gold=M(0xffd166,{emissive:new THREE.Color(0x553a00),roughness:.4});
      p.add(mesh(new THREE.BoxGeometry(1.1,.35,1.1),M(0x8b5a3c),0,.17,0));
      p.add(mesh(new THREE.CylinderGeometry(.14,.2,.7,8),gold,0,.7,0));
      p.add(mesh(new THREE.CylinderGeometry(.75,.38,.95,8),gold,0,1.5,0));
      var t1=mesh(new THREE.TorusGeometry(.38,.07,5,10),gold,-.8,1.55,0);var t2=mesh(new THREE.TorusGeometry(.38,.07,5,10),gold,.8,1.55,0);p.add(t1);p.add(t2);
      starsG=new THREE.Group();starsG.position.y=1.7;
      for(var k=0;k<5;k++){var a=k/5*Math.PI*2;starsG.add(mesh(new THREE.OctahedronGeometry(.17,0),gold,Math.cos(a)*1.5,Math.sin(a*2)*.3,Math.sin(a)*1.5))}
      p.add(starsG);
    }
    if(s.id==='projects'){
      portal=new THREE.Group();
      var stone=M(0x5b4bb5);
      portal.add(mesh(new THREE.BoxGeometry(.4,2.6,.5),stone,-1.2,1.3,0));
      portal.add(mesh(new THREE.BoxGeometry(.4,2.6,.5),stone,1.2,1.3,0));
      portal.add(mesh(new THREE.BoxGeometry(2.8,.4,.5),stone,0,2.7,0));
      portalRing=mesh(new THREE.TorusGeometry(.95,.1,6,18),new THREE.MeshBasicMaterial({color:0xb79cff}),0,1.4,0);portal.add(portalRing);
      var disc=mesh(new THREE.CircleGeometry(.9,18),new THREE.MeshBasicMaterial({color:0x7a5af8,transparent:true,opacity:.55,side:THREE.DoubleSide}),0,1.4,0);portal.add(disc);
      portalCards=new THREE.Group();portalCards.position.y=1.5;
      [0xffb703,0x4cd17a,0xff5d73,0x4d8dff].forEach(function(c,k){var a=k/4*Math.PI*2;var cd=mesh(new THREE.BoxGeometry(.7,.45,.05),new THREE.MeshBasicMaterial({color:c}),Math.cos(a)*1.9,Math.sin(a*1.3)*.4,Math.sin(a)*1.9);portalCards.add(cd)});
      portal.add(portalCards);portal.position.z=-.2;
      p.add(portal);
    }
    if(s.id==='contact'){
      p.add(mesh(new THREE.BoxGeometry(.22,1.3,.22),M(0x8b5a3c),0,.65,0));
      var mb=mesh(new THREE.BoxGeometry(1.2,.75,1.7),M(0xff5d73),0,1.55,0);p.add(mb);
      var cap=mesh(new THREE.CylinderGeometry(.6,.6,1.7,10,1,false,0,Math.PI),M(0xff5d73),0,1.92,0);cap.rotation.x=Math.PI/2;cap.rotation.z=Math.PI/2;
      p.add(mesh(new THREE.BoxGeometry(.06,.5,.3),M(0xffb703),.68,1.9,.2));
      p.add(mesh(new THREE.BoxGeometry(.5,.05,.05),M(0x14213d),0,1.55,.9));
      var plane=mesh(new THREE.ConeGeometry(.28,.8,3),M(0xffffff),1.6,2.8,0);plane.rotation.z=-Math.PI/2.4;plane.scale.set(1,1,.35);p.add(plane);props.plane=plane;
      p.add(pine(-1.8,.4,1));
    }
    g.add(p);scene.add(g);islands.push(g);
  });

  /* sky: clouds + stars */
  var cloudMat=M(0xffffff);var clouds=[];
  var totalH=(N-1)*Y_STEP;
  for(var i=0;i<34;i++){
    var c=new THREE.Group();
    [[0,0,0,1],[.9,.15,0,1.2],[1.8,0,.2,.9],[.9,-.15,.6,.8]].forEach(function(b){
      var m=mesh(new THREE.IcosahedronGeometry(.8*b[3],0),cloudMat,b[0],b[1],b[2]);m.scale.y=.7;c.add(m);
    });
    c.position.set(-18+rnd()*36,6-rnd()*(totalH+14),-14+rnd()*16);
    c.scale.setScalar(.8+rnd()*1.2);c.userData.v=.12+rnd()*.25;
    scene.add(c);clouds.push(c);
  }
  var sg=new THREE.BufferGeometry();var sp3=[];
  for(var i=0;i<420;i++){var th=rnd()*Math.PI*2,ph=Math.acos(2*rnd()-1),R=55;sp3.push(R*Math.sin(ph)*Math.cos(th),R*Math.sin(ph)*Math.sin(th),-Math.abs(R*Math.cos(ph))-5)}
  sg.setAttribute('position',new THREE.Float32BufferAttribute(sp3,3));
  var starMat=new THREE.PointsMaterial({color:0xffffff,size:.35,transparent:true,opacity:0,fog:false});
  var stars=new THREE.Points(sg,starMat);scene.add(stars);

  var skyCols=['#35b4f2','#52c1f6','#86d3f2','#f6c27e','#ef8f8f','#7366cf','#2b2f77','#0b1030'].map(function(h){return new THREE.Color(h)});
  var tmp=new THREE.Color(),cloudDay=new THREE.Color(0xffffff),cloudNight=new THREE.Color(0x8a90c8);
  function sky(t){
    var a=Math.min(N-2,Math.floor(t)),f=t-a;
    tmp.copy(skyCols[a]).lerp(skyCols[a+1],f);
    renderer.setClearColor(tmp,1);scene.fog.color.copy(tmp);
    starMat.opacity=Math.max(0,Math.min(1,(t-4.5)/2.4));
    cloudMat.color.copy(cloudDay).lerp(cloudNight,Math.max(0,Math.min(1,(t-3)/4)));
  }

  function layout(){
    var w=innerWidth,h=innerHeight;
    renderer.setSize(w,h,false);
    cam.aspect=w/h;
    narrow=w<760||w/h<.85;
    cam.fov=narrow?48:42;cam.updateProjectionMatrix();
    islands.forEach(function(g,i){
      g.position.set(narrow?0:(i%2===0?3.7:-3.7),-i*Y_STEP,0);
    });
    document.querySelectorAll('.p3').forEach(function(el,i){el.classList.toggle('left',i%2===0);el.classList.toggle('right',i%2!==0)});
  }

  var mx=0,my=0,raycaster=new THREE.Raycaster(),ptr=new THREE.Vector2();
  window.addEventListener('pointermove',function(e){mx=e.clientX/innerWidth*2-1;my=e.clientY/innerHeight*2-1});
  function hitPortal(e){
    if(!portal)return false;
    var r=canvas.getBoundingClientRect();
    ptr.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height*2-1));
    raycaster.setFromCamera(ptr,cam);
    return raycaster.intersectObject(portal,true).length>0;
  }
  canvas.addEventListener('pointerdown',function(e){if(hitPortal(e))openGallery()});
  canvas.addEventListener('pointermove',function(e){canvas.style.cursor=hitPortal(e)?'pointer':'default'});

  var camX=0;
  function frame(t,time){
    sky(t);
    var camY=-t*Y_STEP+(narrow?-2.6:0);
    camX+=((mx*.9)-camX)*.05;
    cam.position.set(narrow?0:camX,camY+(narrow?0:-my*.4),narrow?18:14.5);
    cam.lookAt(narrow?0:camX*.3,camY,0);
    stars.position.y=camY;
    var tt=time/1000;
    islands.forEach(function(g,i){
      g.position.y=-i*Y_STEP+(reduce?0:Math.sin(tt*.9+i*1.3)*.2);
      g.rotation.y=(reduce?0:Math.sin(tt*.3+i)*.28)+(t-i)*(narrow?.25:-.35);
    });
    if(!reduce){
      armL.rotation.x=Math.sin(tt*1.6)*.1;armR.rotation.x=-Math.sin(tt*1.6)*.1;
      head.rotation.y=mx*.5;head.rotation.x=my*.2;
      if(skillOrbit){skillOrbit.rotation.y=tt*.6;skillOrbit.children.forEach(function(c,k){c.rotation.x=tt*.8+k;c.rotation.y=tt*.6+k})}
      if(globe)globe.rotation.y=tt*.4;
      if(starsG){starsG.rotation.y=tt*.7}
      if(portalRing)portalRing.rotation.z=tt*.8;
      if(portalCards)portalCards.rotation.y=-tt*.5;
      if(props.plane){props.plane.position.x=1.6+Math.sin(tt)*.4;props.plane.position.y=2.8+Math.cos(tt*1.3)*.2}
      clouds.forEach(function(c){c.position.x+=c.userData.v*.016;if(c.position.x>20)c.position.x=-20});
    }
    renderer.render(scene,cam);
  }
  layout();
  return {layout:layout,frame:frame};
}

/* ============ SHARED LOOP ============ */
function build3Dpanels(){
  var host=$('#panels3d');
  host.innerHTML=STOPS.map(function(s,i){return '<div class="p3 '+(i%2===0?'left':'right')+'">'+panelHTML(s,i,'b')+'</div>'}).join('');
  panels3d=[].slice.call(host.querySelectorAll('.panel'));
}
function buildDots(){
  $('#dots').innerHTML=STOPS.map(function(s,i){return '<button type="button" data-g="'+i+'" aria-label="'+s.label+'" title="'+s.label+'"></button>'}).join('');
}
$('#dots').addEventListener('click',function(e){var b=e.target.closest('button[data-g]');if(b)goTo(+b.getAttribute('data-g'))});

function measure(){
  var w=innerWidth,h=innerHeight;
  charX=w<700?w*.22:Math.max(130,w*.26);
  groundH=Math.max(110,Math.min(190,h*.2));
  S=Math.max(w*.9,720);
  var w2=$('#w2d');w2.style.setProperty('--charx',charX+'px');w2.style.setProperty('--groundh',groundH+'px');

function pxDraw(ts){

  c.drawImage(PX.bg,0,0);
  PX.stars.forEach(function(s){if(((Math.floor(t*1.5+s.p*4))%5)!==0)rect(c,s.x,s.y,1,1,s.c)});
  PX.clouds.forEach(function(cl){
    if(!reduce)cl.x+=cl.v;
    if(cl.x>W)cl.x=-PX.cloud.width*cl.s;
    c.drawImage(PX.cloud,Math.round(cl.x),cl.y,PX.cloud.width*cl.s,PX.cloud.height*cl.s);
  });
  var sx=PX.sx,sea=H-PX.sandH;
  for(y=hor+2;y<sea;y+=2){

      var rr=hs(Math.floor(t*3)*131+y*7+k*977);
      if(rr<.7)rect(c,sx-wd+Math.floor(hs(Math.floor(t*3)*17+y*3+k)*wd*2),y,2+k,1,rr<.35?'#ffd86b':'#ffb347');
    }

    var x=((b.x+t*b.v)%(W+30))-15,yb=b.y+Math.sin(t*2+b.p)*2;

  });
  c.drawImage(PX.fg,0,0);
  var ph=Math.min(56,Math.round(H*.26));
  palm(c,Math.round(W*.09),sandTop(W*.09)+2,ph,t,0,1);
  palm(c,Math.round(W*.15),sandTop(W*.15)+2,Math.round(ph*.72),t,2.1,1);

  pvIsland(c3,40,30,50,t,0);pvIsland(c3,114,46,56,t,2);pvIsland(c3,72,72,34,t,4);
  rect(c3,38,26,3,3,'#ff9f1c');
}
function pxLoop(ts){

/* ============ MODE ============ */
function setMode(m){
  if(m==='3d'){
    if(!three){
      build3Dpanels();
      three=build3D();
      if(!three){$('#panels3d').innerHTML='';panels3d=[];toast('3D needs WebGL, which is not available here. Showing 2D instead.');m='2d'}
    }
  }
  mode=m;
  $('#w2d').hidden=m!=='2d';$('#w3d').hidden=m!=='3d';
  $('#m2d').setAttribute('aria-pressed',m==='2d');$('#m3d').setAttribute('aria-pressed',m==='3d');
  $('#bar').hidden=false;$('#dots').hidden=false;$('#hint').hidden=false;
  $('#intro').hidden=true;pxStop();lockScroll(false);
  measure();
  lastActive=-1;
  sp=prog();
}
$('#pick2d').addEventListener('click',function(){window.scrollTo(0,0);setMode('2d')});
$('#pick3d').addEventListener('click',function(){window.scrollTo(0,0);setMode('3d')});
$('#m2d').addEventListener('click',function(){setMode('2d')});
$('#m3d').addEventListener('click',function(){setMode('3d')});
$('#brand').addEventListener('click',function(){$('#intro').hidden=false;pxStart();lockScroll(true);mode=null;$('#w2d').hidden=true;$('#w3d').hidden=true;$('#bar').hidden=true;$('#dots').hidden=true;$('#hint').hidden=true;$('#pick2d').focus()});

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&galleryOpen){closeGallery();return}
  if(!mode||galleryOpen)return;
  var tag=(e.target&&e.target.tagName)||'';if(/INPUT|TEXTAREA|SELECT/.test(tag))return;
  var k=e.key;
  if(k==='ArrowRight'||k==='ArrowDown'||k==='PageDown'){e.preventDefault();goTo(Math.round(sp*(N-1))+1)}
  else if(k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp'){e.preventDefault();goTo(Math.round(sp*(N-1))-1)}
  else if(k==='Home'){e.preventDefault();goTo(0)}
  else if(k==='End'){e.preventDefault();goTo(N-1)}
});
window.addEventListener('resize',function(){measure();if(!$('#intro').hidden)pxStart();if(galleryOpen)rainStart()});

/* ============ BOOT ============ */
build2D();
buildDots();
measure();
lockScroll(true);
pxStart();
requestAnimationFrame(tick);
})();
</script>

</body>
</html>
